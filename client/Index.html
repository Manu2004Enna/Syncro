<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Manuel Ennahli">
    <link rel="stylesheet" href="Style/Login_Register.css">
    
    <title>Syncro</title>
</head>
<body>
    <div id="container">
        <h1>Syncro</h1>
        <div id="button_section">
            <button id="LogInButton">Sign in</button>
            <button id="RegisterButton">Register account</button>
        </div>
        <div class="input-group">
            <label for="nickname">Nickname</label>
            <input id="nicknameInput" name="nickname" required>
        </div>

        <div class="input-group" id="container_password">
            <label for="password">Password</label>
            <!-- Avvolgi solo input e bottone in questo div -->
        <div style="position: relative; width: 100%;">
            <input type="password" id="passwordInput" placeholder="Enter your password" required>
            <button type="button" class="icon_input_password" id="imgButtonPassword">
                <img src="img/eye-closed.svg" alt="eye_password" id="imgPasswordInput">
            </button>
    </div>
        </div>
        <button id="submitButton">Sign in</button>
    </div>

    <script src="script/Init.js"></script>
</body>
</html>
